name: Build Wear OS APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-apk.yml'
      - 'app/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'gradlew'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android build components
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - name: Test and build signed debug APK
        run: bash ./gradlew :app:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace
      - name: Verify and package APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/HrmApp-1.3-name-test.apk
          cp LICENSE dist/LICENSE.txt
          cp app/build/test-results/testDebugUnitTest/TEST-*.xml dist/
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs dist/HrmApp-1.3-name-test.apk | tee dist/signature-verification.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging dist/HrmApp-1.3-name-test.apk > dist/apk-info.txt
          {
            echo "Repository: $GITHUB_REPOSITORY"
            echo "Commit: $GITHUB_SHA"
            echo "Run: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "Build: signed debug APK for ADB sideloading"
            echo "Note: a fresh debug signing key is generated on each clean runner."
          } > dist/build-info.txt
          (cd dist && sha256sum HrmApp-1.3-name-test.apk > SHA256SUMS.txt)
          cat dist/build-info.txt >> "$GITHUB_STEP_SUMMARY"
          cat dist/SHA256SUMS.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Upload installable APK and verification reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: HrmApp-WearOS-name-test
          path: dist/
          if-no-files-found: error
          retention-days: 30
